<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Service Temporarily Unavailable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #020617;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    p {
      color: #94a3b8;
    }
    small {
      color: #64748b;
    }
    .spinner {
      margin-bottom: 20px;
      animation: spin 1.4s linear infinite;
      opacity: 0.9;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

  </style>
</head>
<body>
  <div class="card">
    <svg class="spinner" width="64" height="64" viewBox="0 0 100 100">
      <circle
        cx="50"
        cy="50"
        r="35"
        fill="none"
        stroke="#38bdf8"
        stroke-width="6"
        stroke-linecap="round"
      />
    </svg>
    <h1>We’ll be right back</h1>
    <p>The service is temporarily unavailable while maintenance or recovery is in progress.</p>
    <small>Please check again in a few minutes.</small>
  </div>
</body>
</html>
