<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #020617;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      text-align: center;
      max-width: 480px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: .5rem;
    }
    p {
      color: #94a3b8;
    }
    svg {
      margin-bottom: 20px;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg width="64" height="64" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="22" fill="#38bdf8" class="pulse"/>
    </svg>

    <h1>404</h1>
    <p>The page you’re looking for doesn’t exist.</p>
  </div>

  <style>
    .pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { r: 20; opacity: .6; }
      50% { r: 24; opacity: 1; }
      100% { r: 20; opacity: .6; }
    }
  </style>
</body>
</html>
